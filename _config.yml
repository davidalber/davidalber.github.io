title: David Alber
url: https://www.davidalber.net
description: David Alber's blog.

image_base:  "/images"
date_format: "%b %-d, %Y"

header_pages:
 - about.md

permalink:    /:categories/:year/:month/:title/

plugins:
  - jekyll-paginate
  - jemoji
  - jekyll-feed
paginate:     10
sass:
  style: compressed
  sourcemap: never
  # The Pixyll-era SCSS uses @import and global color functions, which Dart
  # Sass deprecates (removal planned for Dart Sass 3). Silence until the
  # stylesheets are modernized.
  silence_deprecations: [import, global-builtin, color-functions]

exclude: ["README.md", "Rakefile", "Gemfile", "Gemfile.lock", "make-tag-files.sh"]

compress_html:
  comments: ["<!-- ", " -->"]
#  ignore:
#    envs: [dev]

